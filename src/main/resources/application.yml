spring:
  application:
    name:
      job-radar
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT:localhost}:3306/job
    username: user
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus