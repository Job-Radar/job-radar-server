services:
  db:
    image: mysql:8.0
    #container_name: db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DOCKER_USER}
      MYSQL_PASSWORD: ${DOCKER_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DOCKER_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
# 관찰 대상: Spring Boot App
  app:
    build: .
    #container_name: spring-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: db
      DB_USERNAME: ${DOCKER_USER}
      DB_PASSWORD: ${DOCKER_PASSWORD}
      JAVA_OPTS: "-Xms256m -Xmx512m"  # JVM 힙 메모리 제한
#    deploy:
#      resources:
#        limits:
#          cpus: '2'    # CPU 2코어로 제한
#          memory: 1G   # 전체 메모리 1GB로 제한
#        reservations:
#          cpus: '0.5'
#          memory: 512M
    depends_on:
      db:
       condition: service_healthy  # MySQL의 health check가 성공할 때까지 대기

# 메트릭 수집: Prometheus
  prometheus:
    image: prom/prometheus
    #container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
#    deploy:
#      resources:
#        limits:
#          cpus: '0.5'
#          memory: 512M

# 시각화: Grafana
  grafana:
    image: grafana/grafana
    #container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
#    deploy:
#      resources:
#        limits:
#          cpus: '0.5'
#          memory: 512M
volumes:
  mysql_data:
  grafana_data:
